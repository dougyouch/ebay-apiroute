# Which sell_marketing operations get a paginated <name>_all method. eBay pages with offset and
# limit, giving total and a next URL; rules are tried in order, first match wins.
- name: adGroups
  has_parameter: [offset]
  response: {has: [total, adGroups]}
  paginate: {type: offset, total: total, items: adGroups}
