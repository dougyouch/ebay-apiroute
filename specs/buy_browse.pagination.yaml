# Which buy_browse operations get a paginated <name>_all method. eBay pages with offset and
# limit, giving total and a next URL; rules are tried in order, first match wins.
- name: itemSummaries
  method: [GET, POST]
  has_parameter: [offset]
  response: {has: [total, itemSummaries]}
  paginate: {type: offset, total: total, items: itemSummaries}
