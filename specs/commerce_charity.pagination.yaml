# Which commerce_charity operations get a paginated <name>_all method. eBay pages with offset and
# limit, giving total and a next URL; rules are tried in order, first match wins.
- name: charityOrgs
  has_parameter: [offset]
  response: {has: [total, charityOrgs]}
  paginate: {type: offset, total: total, items: charityOrgs}
