# Which commerce_catalog operations get a paginated <name>_all method. eBay pages with offset and
# limit, giving total and a next URL; rules are tried in order, first match wins.
- name: productSummaries
  has_parameter: [offset]
  response: {has: [total, productSummaries]}
  paginate: {type: offset, total: total, items: productSummaries}
