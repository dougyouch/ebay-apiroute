[project]
name = "ebay-apiroute"
dynamic = ["version"]  # from the git tag (hatch-vcs): every merge to main is tagged and released
description = "Python clients for eBay's REST and Trading APIs, generated with apiroute from eBay's published API specs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Doug Youch", email = "dougyouch@gmail.com" }]
requires-python = ">=3.10"
keywords = ["ebay", "api", "client", "rest", "soap", "trading", "sell", "buy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Typing :: Typed",
]
dependencies = ["apiroute[soap]>=2.5.0", "pydantic>=2.6"]

[project.urls]
Homepage = "https://github.com/dougyouch/ebay-apiroute"
Repository = "https://github.com/dougyouch/ebay-apiroute"
Issues = "https://github.com/dougyouch/ebay-apiroute/issues"
Changelog = "https://github.com/dougyouch/ebay-apiroute/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["apiroute[codegen]>=2.5.0", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ebay_apiroute"]

[tool.hatch.build.targets.sdist]
exclude = ["specs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
