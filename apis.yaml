# The APIs this repository generates clients for. scripts/generate.py reads this file.
# To add an API: add an entry, run `uv run python scripts/generate.py --fetch`, commit.

package: ebay_apiroute  # the Python package the clients live in, under src/

apis:
  - name: buy_browse
    title: Browse API
    format: openapi
    spec: https://developer.ebay.com/api-docs/master/buy/browse/openapi/3/buy_browse_v1_oas3.json
    docs: https://developer.ebay.com/api-docs/buy/static/api-browse.html
    module: buy.browse
    client: BuyBrowseApi
    base_class: ebay_apiroute.auth:EbayAuth
    pagination: specs/buy_browse.pagination.yaml   # list operations gain <name>_all methods

  - name: buy_deal
    title: Deal API
    format: openapi
    spec: https://developer.ebay.com/api-docs/master/buy/deal/openapi/3/buy_deal_v1_oas3.json
